name: Cova
description: >-
  Cova is an AI-native home care agency licensed in Michigan and backed by Y
  Combinator (Summer 2026). The company serves Medicaid, long-term care
  insurance (LTCI), and private-pay patients, pays caregivers the highest base
  rate in the state, and helps unpaid family caregivers get paid through
  programs they may not know they qualify for. Cova operates a home care
  platform that connects caregivers with families needing in-home assistance,
  using an AI-driven operational model to reduce traditional agency overhead
  while maximizing caregiver compensation. Founded in 2026 by Jordan Ibe and
  Ansh Tandon, the team is based in Detroit, Michigan. Cova also runs
  MichiganHomeHelp.com as a Medicaid Home Help information resource. As a
  consumer home-care service, Cova does not currently publish a public API,
  developer portal, or developer documentation.
